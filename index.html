<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Розв’язування задач: фотосинтез і хемосинтез</title>
<style>
:root{
  --bg:#f3f7f2; --card:#ffffff; --ink:#13241a; --muted:#46594d; --line:#cfdccf;
  --green:#1b7a48; --green-d:#125734; --green-l:#e3f3e8;
  --amber:#8a5a00; --amber-l:#fff3d6; --red:#b3261e; --red-l:#fde8e6; --blue:#1b4f8a; --blue-l:#e6f0fb;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6}
header.top{background:var(--green-d);color:#fff;padding:14px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top h1{font-size:1.15rem;margin:0;font-weight:700;line-height:1.3;flex:1 1 320px}
.score-pill{background:#fff;color:var(--green-d);border-radius:999px;padding:6px 18px;font-weight:800;font-size:1.05rem;white-space:nowrap}
.stepper{display:flex;flex-wrap:wrap;gap:8px;max-width:1100px;margin:16px auto 0;padding:0 16px}
.stepper button{font:inherit;font-size:.82rem;font-weight:600;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.stepper button.cur{background:var(--green);border-color:var(--green);color:#fff}
.stepper button.done{border-color:var(--green)}
.stepper .b{display:inline-block;margin-left:6px;font-size:.78rem;background:var(--green-l);color:var(--green-d);border-radius:8px;padding:0 6px}
.stepper button.cur .b{background:#fff}
main{max-width:1100px;margin:16px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 30px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{font-size:1.7rem;line-height:1.25;margin:0 0 14px;color:var(--green-d)}
h3{font-size:1.3rem;margin:22px 0 8px;color:var(--green-d)}
p{margin:.5em 0}
.lead{font-size:1.1rem}
.formula{background:var(--green-l);border-left:6px solid var(--green);border-radius:10px;padding:12px 18px;margin:12px 0;font-size:1.15rem;font-weight:600;overflow-x:auto}
.formula.small{font-weight:500;font-size:1.05rem}
.hint{background:var(--amber-l);border-left:6px solid #e0a000;border-radius:10px;padding:12px 18px;margin:14px 0;font-size:.95rem}
.hint b.t{color:var(--amber)}
.note{background:var(--blue-l);border-left:6px solid var(--blue);border-radius:10px;padding:12px 18px;margin:14px 0;font-size:.95rem}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--green-l)}
td.c,th.c{text-align:center}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.25}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.ex{border:2px solid var(--line);border-radius:14px;padding:16px 22px;margin:18px 0}
.ex h3{margin-top:0}
.ex .given{background:#f6f8f6;border-radius:8px;padding:8px 14px;margin:8px 0}
.ex ol{margin:6px 0 6px 0;padding-left:28px}
.ex li{margin:6px 0}
.ans{font-weight:800;color:var(--green-d);background:var(--green-l);padding:8px 14px;border-radius:8px;margin-top:10px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],textarea,select{font:inherit;font-size:1.05rem;padding:10px 14px;border:2px solid #9db39f;border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:3px solid #8fd1a9;border-color:var(--green)}
textarea{min-height:130px;resize:vertical}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.err{border-color:var(--red)!important}
.ansrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.ansrow .lab{font-weight:700;min-width:210px;font-size:1.05rem}
.ansrow input{width:190px}
.ansrow .unit{font-weight:700}
.st{font-weight:700;padding:3px 12px;border-radius:8px;font-size:.9rem}
.st.ok{background:var(--green-l);color:var(--green-d)} .st.bad{background:var(--red-l);color:var(--red)}
button.btn{font:inherit;font-weight:700;font-size:1rem;padding:12px 24px;border-radius:12px;border:none;background:var(--green);color:#fff;cursor:pointer}
button.btn:hover{background:var(--green-d)}
button.btn.sec{background:#fff;color:var(--green-d);border:2px solid var(--green)}
button.btn.sec:hover{background:var(--green-l)}
button.btn.red{background:var(--red)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.drop{border:3px dashed #9db39f;border-radius:14px;padding:20px;text-align:center;background:#fafcf9}
.drop.over{background:var(--green-l);border-color:var(--green)}
.drop img{max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--line)}
.small{font-size:.85rem;color:var(--muted)}
.pts{float:right;background:var(--green-l);color:var(--green-d);font-weight:800;border-radius:10px;padding:4px 14px;font-size:.95rem}
.cond{font-size:1.1rem;background:#f9fbf8;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:10px 0}
.big{font-size:2.4rem;font-weight:800;color:var(--green-d)}
.overlay{position:fixed;inset:0;background:rgba(10,30,18,.6);z-index:50;overflow:auto;padding:20px}
.panel{background:#fff;max-width:1200px;margin:0 auto;border-radius:16px;padding:24px 28px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:2px solid var(--green);background:#fff;cursor:pointer;color:var(--green-d)}
.tabs button.cur{background:var(--green);color:#fff}
tr.sel{background:var(--green-l)}
.clk{cursor:pointer}
.shot{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0}
footer{max-width:1100px;margin:0 auto 30px;padding:0 16px;text-align:right}
footer button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.8rem}
@media (max-width:640px){html{font-size:18px}.card{padding:18px 16px}.ansrow .lab{min-width:100%}}
@media print{header.top .score-pill{border:1px solid #000}.stepper,.nav,.btnrow,footer{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
label.chk{display:flex;gap:14px;align-items:flex-start;margin:12px 0;font-size:1rem;cursor:pointer;line-height:1.45}label.chk input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--green)}
</style>
</head>
<body>
<header class="top">
  <h1>Розв’язування задач на тему «Фотосинтез і хемосинтез»</h1>
  <div class="score-pill" id="scorePill">Бали: 0 / 12</div>
</header>
<div class="stepper" id="stepper"></div>
<main id="main"></main>
<footer><button onclick="Teacher.open()">Для вчителя</button></footer>
<div id="teacherRoot"></div>

<script>
/* ============ НАЛАШТУВАННЯ ДЛЯ ВЧИТЕЛЯ ============ */
const CFG = {
  TEACHER_PASSWORD: 'teacher2026',   // змініть пароль доступу до відповідей та результатів
  TEACHER_EMAIL: '',                 // за потреби: e-mail вчителя (з'явиться кнопка «Надіслати листом»)
  MAX_ATT: 2,                        // кількість спроб на кожну задачу
  STORE: 'fotosyntez_praktychna_v2'
};
// 5 задач × 2 бали + висновок 2 бали = 12 балів
const MAXTOTAL = 12;

/* ============ ЗАДАЧІ ============ */
const EQ_PH = '6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂';
const TASKS = [
 {
  text:'Розрахуйте, скільки кілограмів глюкози синтезовано рослинами під час фотосинтезу, якщо відомо, що при цьому виділилося 22 400 літрів кисню.',
  fields:[{id:'a',label:'m(C₆H₁₂O₆) =',unit:'кг',ref:30,tol:.02,weight:1}],
  sol:'<ol><li>n(O₂) = V : V<sub>m</sub> = 22 400 : 22,4 = 1000 моль.</li><li>За рівнянням n(C₆H₁₂O₆) : n(O₂) = 1 : 6, тому n(C₆H₁₂O₆) = 1000 : 6 = 166,7 моль.</li><li>m(C₆H₁₂O₆) = 166,7 · 180 = 30 000 г = <b>30 кг</b>.</li></ol>'
 },
 {
  text:'За добу людина споживає в середньому 430 г O₂. Одне дерево середніх розмірів за вегетаційний період поглинає близько 42 кг CO₂. На скільки діб вистачить людині кисню, продукованого одним деревом за вегетаційний період? Скільки дерев має припадати на одну людину, щоб забезпечити її киснем протягом року?',
  fields:[
    {id:'a',label:'Кисню вистачить на',unit:'діб',ref:71,tol:.015,weight:.5},
    {id:'b',label:'Дерев на одну людину',unit:'шт.',ref:5.14,tol:.02,alt:[5,6],weight:.5}
  ],
  sol:'<ol><li>m(CO₂) = 42 000 г; n(CO₂) = 42 000 : 44 = 954,5 моль.</li><li>n(O₂) = n(CO₂) = 954,5 моль; m(O₂) = 954,5 · 32 ≈ 30 545 г ≈ 30,5 кг.</li><li>Діб: 30 545 : 430 ≈ <b>71 доба</b>.</li><li>Дерев на рік: 365 : 71 ≈ <b>5,1</b> (практично 5–6 дерев). Перевірка: 430 · 365 = 156 950 г; 156 950 : 30 545 ≈ 5,14.</li></ol>'
 },
 {
  text:'У процесі фотосинтезу за один світловий день (12 годин) рослина помідора вбирає 132 г CO₂. Яка маса глюкози і кисню (теоретично) може утворитися в її листках протягом 10 днів? Яка продуктивність фотосинтезу у помідора, якщо площа листкової пластинки дорівнює 1 м²?',
  fields:[
    {id:'a',label:'m(C₆H₁₂O₆) за 10 днів =',unit:'г',ref:900,tol:.02,weight:1/3},
    {id:'b',label:'m(O₂) за 10 днів =',unit:'г',ref:960,tol:.02,weight:1/3},
    {id:'c',label:'Продуктивність',unit:'г/(м²·год)',ref:7.5,tol:.02,weight:1/3}
  ],
  sol:'<ol><li>За 1 день: n(CO₂) = 132 : 44 = 3 моль. За 10 днів: 30 моль.</li><li>n(C₆H₁₂O₆) = 30 : 6 = 5 моль; m = 5 · 180 = <b>900 г</b>.</li><li>n(O₂) = n(CO₂) = 30 моль; m(O₂) = 30 · 32 = <b>960 г</b>.</li><li>За 1 день (12 год) утворюється 3 : 6 = 0,5 моль = 90 г глюкози; продуктивність: 90 : 12 = <b>7,5 г/(м²·год)</b>.</li></ol>'
 },
 {
  text:'Визначте, яку кількість речовини аміаку повинні окислити нітрифікуючі бактерії для синтезу 360 г глюкози, якщо для синтезу 1 моль глюкози використовується близько 12 600 кДж енергії.',
  fields:[{id:'a',label:'n(NH₃) =',unit:'моль',ref:79.4,tol:.02,weight:1}],
  sol:'<ol><li>n(C₆H₁₂O₆) = 360 : 180 = 2 моль.</li><li>Потрібна енергія: Q = 2 · 12 600 = 25 200 кДж.</li><li>Окислення 2 моль NH₃ дає 635 кДж. Складаємо пропорцію: 2 моль — 635 кДж; x моль — 25 200 кДж.</li><li>x = 2 · 25 200 : 635 ≈ <b>79,4 моль</b>.</li></ol>'
 },
 {
  text:'У результаті діяльності залізобактерій на дні болота відклалося 1500 т залізної руди. Скільки тепла виділилось залізобактеріями в навколишнє середовище, якщо вуглекислого газу було достатньо, а коефіцієнт використання енергії становить 0,22 (22 %)? Яка кількість речовини вуглеводів синтезована бактеріями?',
  fields:[
    {id:'a',label:'Тепла виділено в середовище',unit:'· 10⁸ кДж',ref:8.86,tol:.02,weight:.5},
    {id:'b',label:'n(вуглеводів) =',unit:'· 10⁴ моль',ref:1.98,tol:.02,weight:.5}
  ],
  sol:'<ol><li>n(Fe(OH)₃) = 1,5·10⁹ г : 107 г/моль ≈ 1,40·10⁷ моль.</li><li>Загальна енергія реакції: на 4 моль Fe(OH)₃ — 324 кДж, отже Q = 1,40·10⁷ : 4 · 324 ≈ 1,136·10⁹ кДж.</li><li>Корисно використано 22 %: 0,22 · 1,136·10⁹ ≈ 2,50·10⁸ кДж. У середовище виділено решту 78 %: 0,78 · 1,136·10⁹ ≈ <b>8,86·10⁸ кДж</b>.</li><li>n(вуглеводів) = 2,50·10⁸ : 12 600 ≈ <b>1,98·10⁴ моль</b> (≈ 19 800 моль).</li></ol>'
 }
];

/* ============ СТОРІНКИ ============ */
const PAGES = [{k:'start',l:'Початок'},{k:'crit',l:'Критерії'},{k:'theory',l:'Теорія'},{k:'examples',l:'Приклади'}]
  .concat(TASKS.map((t,i)=>({k:'t'+i,l:'Задача '+(i+1),t:i})))
  .concat([{k:'concl',l:'Висновок'},{k:'result',l:'Результат'}]);
const FIRST_TASK_PAGE = 4;

/* критерії письмової частини (самооцінка учня + перевірка вчителя) */
const WR = [
  {t:'Умову записано: «Дано» і «Знайти» (позначення, числові значення, одиниці виміру)', w:.25},
  {t:'Записано рівняння реакції з розставленими коефіцієнтами', w:.25},
  {t:'Хід розв’язання: формули (n = m : M, n = V : V<sub>m</sub>), співвідношення за рівнянням, обчислення з одиницями, записана відповідь', w:.5}
];
const CR = [
  {t:'Висновок відповідає меті роботи: сказано, які навички закріплено', w:.5},
  {t:'Розкрито суть фотосинтезу й хемосинтезу: джерело енергії, вихідні та кінцеві речовини', w:.5},
  {t:'Висновок підтверджено числами та результатами розв’язаних задач', w:.5},
  {t:'Названо значення цих процесів для природи й людини; оцінено власну роботу (що вдалося, що було важким)', w:.5}
];
const CONCL_MIN = 40;

/* ============ СТАН ============ */
function fresh(){
  return {student:{surname:'',name:'',cls:''},page:0,startedAt:null,finishedAt:null,
    tasks:TASKS.map(t=>({att:0,f:Object.fromEntries(t.fields.map(f=>[f.id,{v:'',ok:false,att:0,wrong:false}])),shot:null,chk:[0,0,0]})),
    concl:{text:'',chk:[0,0,0,0]}};
}
let S = load() || fresh();
let notice = '';
function load(){try{const r=localStorage.getItem(CFG.STORE);if(!r)return null;const o=JSON.parse(r);if(o&&o.tasks&&o.tasks.length===TASKS.length&&o.concl&&o.tasks[0].chk)return o}catch(e){}return null}
function save(){
  try{localStorage.setItem(CFG.STORE,JSON.stringify(S))}
  catch(e){try{const c=JSON.parse(JSON.stringify(S));c.tasks.forEach(t=>t.shot=null);localStorage.setItem(CFG.STORE,JSON.stringify(c))}catch(e2){}}
}
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n=>String(Math.round(n*100)/100).replace('.',',');
const words = s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const isSet = v=>v!==undefined&&v!==null&&v!=='';

function parseNum(v){const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n}
function isCorrect(f,v){
  const n=parseNum(v); if(n===null)return false;
  if(f.alt&&f.alt.indexOf(n)>=0)return true;
  return Math.abs(n-f.ref)<=Math.abs(f.ref)*f.tol;
}
function wrAuto(s){let w=0;if(s.shot)WR.forEach((c,k)=>{if(s.chk[k])w+=c.w});return w}
function taskScore(i,st){
  st=st||S; const t=TASKS[i], s=st.tasks[i]; let a=0;
  t.fields.forEach(f=>{const x=s.f[f.id]; if(x&&x.ok) a+=f.weight*(x.att===1?1:.5)});
  let wr=wrAuto(s); if(st.tadj&&isSet(st.tadj[i]))wr=Number(st.tadj[i]);
  return {a:a,wr:wr,total:a+wr};
}
function conclAuto(st){let c=0;if(words(st.concl.text)>=CONCL_MIN)CR.forEach((x,k)=>{if(st.concl.chk[k])c+=x.w});return c}
function conclScore(st){st=st||S;return isSet(st.cadj)?Number(st.cadj):conclAuto(st)}
function totalScore(st){let t=conclScore(st);TASKS.forEach((_,i)=>t+=taskScore(i,st).total);return t}
function level(g){return g>=10?'високий рівень':g>=7?'достатній рівень':g>=4?'середній рівень':'початковий рівень'}
function studentOk(){const s=S.student;return s.surname.trim()&&s.name.trim()&&s.cls.trim()}

/* ============ НАВІГАЦІЯ ============ */
function go(p){
  if(p>=FIRST_TASK_PAGE && !studentOk()){notice='Спочатку введіть прізвище, ім’я та клас.';p=0}
  else notice='';
  if(p>FIRST_TASK_PAGE-1 && !S.startedAt){S.startedAt=new Date().toISOString()}
  S.page=p; save(); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function updateScore(){
  $('scorePill').textContent='Бали: '+fmt(totalScore())+' / '+MAXTOTAL;
  renderStepper();
}
function renderStepper(){
  $('stepper').innerHTML=PAGES.map((p,i)=>{
    let b='',cls='';
    if(p.t!==undefined){const sc=taskScore(p.t);b='<span class="b">'+fmt(sc.total)+'</span>';if(sc.total>=1.99)cls=' done'}
    if(p.k==='concl'){const c=conclScore();b='<span class="b">'+fmt(c)+'</span>';if(c>=1.99)cls=' done'}
    return '<button class="'+(i===S.page?'cur':'')+cls+'" onclick="go('+i+')">'+esc(p.l)+b+'</button>';
  }).join('');
}
function navBar(i){
  return '<div class="nav"><div>'+(i>0?'<button class="btn sec" onclick="go('+(i-1)+')">← Назад</button>':'')+'</div><div>'+
    (i<PAGES.length-1?'<button class="btn" onclick="go('+(i+1)+')">Далі →</button>':'')+'</div></div>';
}

/* ============ РЕНДЕР СТОРІНОК ============ */
function render(){
  const p=PAGES[S.page]; let h='';
  if(p.k==='start')h=pStart(); else if(p.k==='crit')h=pCrit(); else if(p.k==='theory')h=pTheory();
  else if(p.k==='examples')h=pExamples(); else if(p.k==='concl')h=pConcl(); else if(p.k==='result')h=pResult(); else h=pTask(p.t);
  $('main').innerHTML=h+navBar(S.page);
  updateScore();
}

function pStart(){
  const s=S.student;
  return '<div class="card"><h2>Інструктивна картка</h2>'+
  '<p class="lead"><b>Тема:</b> Розв’язування задач на тему «Фотосинтез і хемосинтез».</p>'+
  '<p class="lead"><b>Мета:</b> удосконалити навички розв’язування задач з теми «Фотосинтез і хемосинтез».</p>'+
  '<p class="lead"><b>Обладнання й матеріали:</b> підручник, зошит, ручка, телефон або комп’ютер (для фото розв’язання).</p>'+
  '<h3>Хід роботи</h3><ol>'+
  '<li>Введіть прізвище, ім’я та клас (внизу цієї сторінки).</li>'+
  '<li>Ознайомтеся з критеріями оцінювання (сторінка «Критерії»).</li>'+
  '<li>Прочитайте теорію та розгляньте приклади розв’язання задач.</li>'+
  '<li>Розв’яжіть задачі 1–5 <b>у зошиті</b>. Оформлюйте їх так, як показано нижче.</li>'+

  '<p>Хемосинтез має <b>дві стадії</b>: 1) окиснення неорганічної речовини з виділенням енергії; 2) використання цієї енергії для синтезу глюкози з CO₂ та H₂O (так само, як у темновій фазі фотосинтезу).</p>'+

}

  const w=$('wpts'+i); if(w)w.textContent='Розв’язання: '+fmt(sc.wr)+' / '+fmt(WR.reduce((x,c)=>x+c.w,0))+' б.';

function checkTask(i){
  const t=TASKS[i], s=S.tasks[i]; if(s.att>=CFG.MAX_ATT)return;
  let any=false;
  t.fields.forEach(f=>{const x=s.f[f.id]; if(!x.ok&&String(x.v).trim()!=='')any=true});
  if(!any){notice='Спочатку введіть відповідь у поле.';render();return}
  notice=''; s.att++;
  t.fields.forEach(f=>{const x=s.f[f.id]; if(x.ok)return;
    if(String(x.v).trim()==='')return;
    if(isCorrect(f,x.v)){x.ok=true;x.att=s.att;x.wrong=false}else x.wrong=true});
  save(); render();
}

function refreshConcl(){

/* зображення */
function readImg(file,cb){
  if(!file||!/^image\//.test(file.type))return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=1100;let w=im.width,h=im.height;if(w>m){h=Math.round(h*m/w);w=m}
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',.72))};
    im.src=r.result};
  r.readAsDataURL(file);
}
function setShot(i,d){S.tasks[i].shot=d;save();render()}
function removeShot(i){S.tasks[i].shot=null;save();render()}
function curTask(){const p=PAGES[S.page];return p.t}

  rows+='<tr><td>Висновок до роботи</td><td class="c">—</td><td class="c">—</td><td class="c"><b>'+fmt(conclScore())+'</b> / 2</td></tr>';

  '<p class="small">Код результату — це короткий текст без скриншотів; його можна вставити в повідомлення. Повний файл зі скриншотами надійніший.</p>'+

function pack(withShots){
  const c=JSON.parse(JSON.stringify(S)); delete c.page;
  if(!withShots)c.tasks.forEach(t=>t.shot=null);
  return {v:2,app:'fotosyntez-praktychna',max:MAXTOTAL,student:c.student,startedAt:c.startedAt,finishedAt:c.finishedAt,tasks:c.tasks,concl:c.concl};
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function fileName(){const s=S.student;return ('Результат_'+s.surname+'_'+s.name+'_'+s.cls).replace(/[\s\\\/:*?"<>|]+/g,'_')+'.json'}
function finish(){
  if(!studentOk()){go(0);return}
  S.finishedAt=new Date().toISOString();save();
  download(fileName(),JSON.stringify(pack(true)));render();
}
function encode(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
function copyCode(){
  if(!S.finishedAt){S.finishedAt=new Date().toISOString();save()}
  const code=encode(pack(false)), box=$('codeBox'); box.style.display='block'; box.value=code; box.select();
  try{navigator.clipboard.writeText(code).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(e2){}}
  box.scrollIntoView({block:'center'});
}
function mailTeacher(){
  const s=S.student, tot=fmt(totalScore());
  const body='Прізвище, ім’я: '+s.surname+' '+s.name+'\nКлас: '+s.cls+'\nБали (авто): '+tot+' / '+MAXTOTAL+'\n\nКод результату:\n'+encode(pack(false))+'\n\n(Файл зі скриншотами додайте до листа вручну.)';
  location.href='mailto:'+CFG.TEACHER_EMAIL+'?subject='+encodeURIComponent('Практична робота: '+s.surname+' '+s.name+', '+s.cls)+'&body='+encodeURIComponent(body);

/* ============ ПОДІЇ ============ */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.st){S.student[el.dataset.st]=el.value;save()}
  else if(el.dataset.f!==undefined){
    const x=S.tasks[+el.dataset.t].f[el.dataset.f]; x.v=el.value; x.wrong=false; save();
    const st=el.parentNode.querySelector('.st'); if(st)st.remove();
  }
  else if(el.dataset.cconcl!==undefined){S.concl.text=el.value;save();refreshConcl()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.file!==undefined){const i=+el.dataset.file;readImg(el.files[0],d=>setShot(i,d))}
  else if(el.dataset.chk!==undefined){const a=el.dataset.chk.split(':');S.tasks[+a[0]].chk[+a[1]]=el.checked?1:0;save();refreshPts(+a[0])}
  else if(el.dataset.cc!==undefined){S.concl.chk[+el.dataset.cc]=el.checked?1:0;save();refreshConcl()}
});
document.addEventListener('paste',e=>{
  const i=curTask(); if(i===undefined)return;
  const items=(e.clipboardData||{}).items||[];
  for(const it of items){if(it.type.indexOf('image')===0){readImg(it.getAsFile(),d=>setShot(i,d));e.preventDefault();break}}
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest('[data-drop]'); if(!d)return;
  e.preventDefault();
  if(ev==='dragover')d.classList.add('over'); else d.classList.remove('over');
  if(ev==='drop'){const f=e.dataTransfer.files[0];readImg(f,x=>setShot(+d.dataset.drop,x))}
}));

      h+='<h3>Висновок — '+fmt(conclScore(r))+' / 2 б. <span class="small">('+words(r.concl.text)+' слів)</span></h3><div class="cond" style="white-space:pre-wrap">'+(r.concl.text?esc(r.concl.text):'<i>немає</i>')+'</div>'+
        '<p><b>Самооцінка учня:</b></p><ul>'+CR.map((c,k)=>'<li>'+(r.concl.chk[k]?'✓ ':'✗ ')+c.t+'</li>').join('')+'</ul>'+
        '<p><b>Бали за висновок (0–2):</b> <input type="text" inputmode="decimal" style="width:90px;padding:4px 8px;text-align:center" value="'+(isSet(r.cadj)?esc(r.cadj):'')+'" placeholder="'+fmt(conclAuto(r))+'" onchange="Teacher.setC('+n+',this.value)"> <span class="small">порожньо — за самооцінкою ('+fmt(conclAuto(r))+')</span></p>';
      h+='</div>';
    }
    return h;
  }
};

render();
</script>
</body>
</html>
